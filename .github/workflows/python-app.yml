name: Run Python Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files in current directory
        # این خط کمک می‌کند ببینی آیا فایل main.py وجود دارد یا خیر
        run: ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python script
        # اگر نام فایل متفاوت است، اینجا را تغییر بده
        run: |
          echo "Starting execution..."
          if [ -f test1.py ]; then
            python test1.py
          else
            echo "Error: main.py not found!"
            exit 1
          fi
